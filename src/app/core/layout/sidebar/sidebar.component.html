<!-- Sidebar -->
<aside class="app-sidebar" [attr.data-expanded]="layoutService.isSidebarExpanded()"
    [attr.data-mobile-open]="layoutService.isMobileSidebarOpen()" (mouseenter)="onMouseEnter()"
    (mouseleave)="onMouseLeave()">
    <div class="sidebar-brand">
        <a routerLink="/dashboard" class="pp-logo">
            <img class="logo-icon" src="../assets/images/logo-collapse.png" alt="PatientPortal"
                style="height: 28px; width: auto; display: block; flex-shrink: 0;">
            <img class="logo-full word" src="../assets/images/logo.png" alt="PatientPortal"
                style="height: 22px; width: auto; display: block;">
        </a>
    </div>

    <nav class="sidebar-nav">
        <a *ngFor="let item of navItems" class="sidebar-item" [routerLink]="item.href" routerLinkActive="active"
            (click)="closeMobile()">
            <span class="icon">
                <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round" [innerHTML]="item.iconSvg | safeHtml">
                </svg>
            </span>
            <span class="label">{{ item.label }}</span>
        </a>

        <!-- Logout button at end of nav -->
        <button class="sidebar-item" (click)="logout()"
            style="margin-top: auto; width: 100%; background: none; border: none; cursor: pointer; text-align: left; color: inherit; padding: 0; font: inherit;">
            <span class="icon">
                <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M13 14l3-4-3-4M16 10H8M8 3H5a1 1 0 00-1 1v12a1 1 0 001 1h3" />
                </svg>
            </span>
            <span class="label">Logout</span>
        </button>
    </nav>

    <div class="sidebar-footer">
        <a class="sidebar-item" href="#" (click)="closeMobile()">
            <span class="icon">
                <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="10" cy="10" r="7" />
                    <path d="M8 8a2 2 0 114 0c0 1.2-2 1.4-2 3M10 14.5v.5" />
                </svg>
            </span>
            <span class="label">Help &amp; support</span>
        </a>
        <a class="sidebar-item" href="#" (click)="closeMobile()">
            <span class="icon">
                <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="10" cy="10" r="2.5" />
                    <path
                        d="M16 10l1-2-1-2-2 .5L13 5l-2 1-2-1-1 1.5L6 6 5 8l1 2-1 2 1 2 2-.5 1 1.5 2-1 2 1 1-1.5 2-.5-1-2z" />
                </svg>
            </span>
            <span class="label">Settings</span>
        </a>
    </div>
</aside>

<!-- Mobile Scrim -->
<div class="sidebar-scrim" *ngIf="layoutService.isMobileSidebarOpen()" (click)="closeMobile()"></div>
