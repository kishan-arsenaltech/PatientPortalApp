<div class="inbox-shell">
  <app-inbox-list [items]="inboxItems" [selectedId]="selectedItemId" [filters]="filters"
    (selectItem)="selectItem($event)" (openFilters)="toggleFiltersModal(true)" (filterChange)="selectFilter($event)">
  </app-inbox-list>

  <app-inbox-detail [item]="selectedItem" [tabs]="detailTabs" (selectTab)="selectTab($event)">
  </app-inbox-detail>
</div>

<!-- Filters modal -->
<div class="modal-backdrop" *ngIf="isFiltersModalOpen">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 class="modal-title">Inbox filters</h3>
      <button class="icon-btn" (click)="toggleFiltersModal(false)"><svg width="16" height="16" viewBox="0 0 20 20"
          fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M5 5l10 10M15 5L5 15" />
        </svg></button>
    </div>
    <div class="modal-body">
      <div class="field-row" style="margin-bottom:14px;">
        <div class="field"><label class="label">Type</label><select class="select">
            <option>All types</option>
            <option>New Faxes</option>
            <option>Referrals</option>
            <option>Refunds</option>
          </select></div>
        <div class="field"><label class="label">Status</label><select class="select">
            <option>Any status</option>
            <option>Unread</option>
            <option>In progress</option>
            <option>Completed</option>
          </select></div>
      </div>
      <div class="field-row" style="margin-bottom:14px;">
        <div class="field"><label class="label">Received from</label><input type="date" class="input"
            value="2026-01-15"></div>
        <div class="field"><label class="label">Received to</label><input type="date" class="input" value="2026-01-29">
        </div>
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label class="label">Assigned to</label>
        <select class="select">
          <option>Anyone</option>
          <option>Me</option>
          <option>My team</option>
          <option>Unassigned</option>
        </select>
      </div>
      <div class="field">
        <label class="label">Markets</label>
        <div style="display:flex; gap:8px; flex-wrap:wrap; padding: 6px 0;">
          <label class="checkbox"><input type="checkbox" checked><span class="box"><svg width="10" height="10"
                viewBox="0 0 10 10" fill="none">
                <path d="M2 5l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg></span>Austin, TX</label>
          <label class="checkbox"><input type="checkbox" checked><span class="box"><svg width="10" height="10"
                viewBox="0 0 10 10" fill="none">
                <path d="M2 5l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg></span>Dallas, TX</label>
          <label class="checkbox"><input type="checkbox"><span class="box"><svg width="10" height="10"
                viewBox="0 0 10 10" fill="none">
                <path d="M2 5l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg></span>Phoenix, AZ</label>
          <label class="checkbox"><input type="checkbox"><span class="box"><svg width="10" height="10"
                viewBox="0 0 10 10" fill="none">
                <path d="M2 5l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg></span>Denver, CO</label>
          <label class="checkbox"><input type="checkbox"><span class="box"><svg width="10" height="10"
                viewBox="0 0 10 10" fill="none">
                <path d="M2 5l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg></span>Atlanta, GA</label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" (click)="toggleFiltersModal(false)">Reset</button>
      <button class="btn btn-secondary" (click)="toggleFiltersModal(false)">Cancel</button>
      <button class="btn btn-primary" (click)="toggleFiltersModal(false)">Apply filters</button>
    </div>
  </div>
</div>
