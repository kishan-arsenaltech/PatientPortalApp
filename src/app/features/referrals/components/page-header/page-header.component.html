<div class="page-head">
  <div>
    <div style="font-size:12px; color: var(--text-subtle); margin-bottom: 4px;">
      {{ breadcrumbParent }}
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2" style="display:inline-block; margin: 0 4px;">
        <path d="M4 2l3 3-3 3"/>
      </svg>
      {{ breadcrumbCurrent }}
    </div>
    <h1>{{ title }}</h1>
    <p class="subtext">{{ subtitle }}</p>
  </div>

  <div class="page-head-actions">
    <span *ngIf="showDraftBadge" class="autosave-pill">
      {{ lastSavedLabel || 'Draft auto-saved' }}
    </span>
    <span class="discard-link" (click)="discard.emit()">Discard</span>
  </div>
</div>
